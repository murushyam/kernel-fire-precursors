[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kfp"
version = "0.1.0"
description = "Kernel precursors of wildfire occurrence and quantum-vs-classical kernel benchmark"
authors = [{name = "M.S. Shyam Sunder", email = "murushyam@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "xarray", "dask"]

[project.optional-dependencies]
quantum = ["qiskit", "qiskit-machine-learning"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
